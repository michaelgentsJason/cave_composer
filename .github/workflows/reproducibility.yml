name: Reproducibility
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --only-binary=:all: -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=outputs/ci-tests.xml
      - run: python scripts/check_reproducibility.py --output outputs/ci-reproduction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-receipts
          path: |
            outputs/ci-tests.xml
            outputs/ci-reproduction/verification.json
            outputs/ci-reproduction/*.log
