schema_version: 1
paper: CAVERN
authority: Unique paper claim ledger; implementation facts require current code and
  pinned raw records, not old prose.
status_definitions:
  implemented: code exists; performance unestablished
  geometry_verified: named mesh/task geometric record with explicit scope
  adapter_checked: offline schema, integrity or projection check only
  simulator_runtime_verified: Actual simulator evidence for named tested assets/operations
    only; no automatic Lab/vehicle/policy implication.
  training_reported_by_collaborator: external/user report; not locally reproduced
  policy_evaluated: raw frozen-policy episodes and review required; none this round
  not_run: planned, no empirical result
  blocked: named missing prerequisites
audit_snapshot: research_workspace/evidence/local_audit_v01.json
version_rule: Dataset record source hashes take precedence over the repeated 0.3.0
  package label. Never attribute old training data to later geometry features.
