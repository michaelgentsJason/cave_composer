[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-composer"
version = "0.1.0"
description = "Constraint-first procedural cave worlds for robot navigation research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-image>=0.22", "trimesh>=4.0", "rtree>=1.0", "PyYAML>=6", "Pillow>=10", "matplotlib>=3.8"]

[project.scripts]
cave-compose = "cave_composer.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cave_composer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
